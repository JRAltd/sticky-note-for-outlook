<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Sticky Notes — Global Dashboard</title>
    <link rel="icon" type="image/png" href="./assets/icon-32.png" />
    <link rel="stylesheet" href="./styles.css?v=2.3" />
    <!-- TeamsJS & Office.js APIs for M365 App Bar and Outlook -->
    <script
      type="text/javascript"
      src="https://res.cdn.office.net/teams-js/2.22.0/js/MicrosoftTeams.min.js"
    ></script>
    <script
      type="text/javascript"
      src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"
    ></script>
  </head>
  <body class="dashboard-mode">
    <div id="root"></div>
    <script>
      if (window.microsoftTeams && window.microsoftTeams.app) {
        try {
          window.microsoftTeams.app.initialize().then(function () {
            window.microsoftTeams.app.notifySuccess();
          }).catch(function () {});
        } catch (e) {}
      }
    </script>
    <script src="./notes-core.js?v=2.3"></script>
    <script src="./app.bundle.js?v=2.3"></script>
  </body>
</html>
