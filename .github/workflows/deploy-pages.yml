name: Deploy Outlook Add-in to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Auto-stamp dist/manifest.xml with GitHub Pages URL
        shell: bash
        run: |
          ORIGIN="${{ steps.pages.outputs.origin }}"
          BASE_URL="${{ steps.pages.outputs.base_url }}"
          BASE_URL="${BASE_URL%/}"
          echo "Stamping manifest with Origin=$ORIGIN and BaseURL=$BASE_URL"
          sed -e "s|<AppDomain>https://localhost:3000</AppDomain>|<AppDomain>${ORIGIN}</AppDomain>|g" \
              -e "s|https://localhost:3000/taskpane.html\"|${BASE_URL}/taskpane.html\"|g" \
              -e "s|https://localhost:3000|${BASE_URL}|g" \
              manifest.xml > dist/manifest.xml
          touch dist/.nojekyll

      - name: Upload ./dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
