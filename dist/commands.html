<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Sticky Notes Commands</title>
    <script
      type="text/javascript"
      src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"
    ></script>
  </head>
  <body>
    <script>
      (function () {
        var CUSTOM_PROP_NOTES_KEY = "jraltd_email_sticky_notes_v2";
        var LOCAL_STORAGE_NOTES_PREFIX = "outlook_sticky_notes_item_";

        function addQuickStickyNote(event) {
          try {
            var item =
              window.Office &&
              Office.context &&
              Office.context.mailbox &&
              Office.context.mailbox.item;
            if (!item) {
              if (event && event.completed) event.completed();
              return;
            }
            var itemId = item.itemId || item.conversationId || "default-item";
            var nowIso = new Date().toISOString();
            var quickNote = {
              id: "quick-" + Date.now(),
              itemId: itemId,
              conversationId: item.conversationId || itemId,
              scope: "message",
              emailSubject: item.subject || "(No Subject)",
              emailSender:
                item.from && item.from.emailAddress
                  ? item.from.displayName + " <" + item.from.emailAddress + ">"
                  : "Sender",
              title: "Quick Follow-up Stamp",
              content:
                "Flagged for follow-up on " + new Date().toLocaleString() + ".",
              color: "yellow",
              priority: "high",
              tags: ["follow-up"],
              checklist: [],
              isPinned: true,
              author:
                (Office.context.mailbox.userProfile &&
                  Office.context.mailbox.userProfile.displayName) ||
                "Outlook User",
              createdAt: nowIso,
              updatedAt: nowIso,
              syncStatus: "synced_office",
            };

            item.loadCustomPropertiesAsync(function (res) {
              if (res.status === Office.AsyncResultStatus.Succeeded) {
                var cp = res.value;
                var existing = [];
                try {
                  var raw = cp.get(CUSTOM_PROP_NOTES_KEY);
                  if (raw) existing = JSON.parse(raw) || [];
                } catch (e) {}
                var updated = [quickNote].concat(existing);
                cp.set(CUSTOM_PROP_NOTES_KEY, JSON.stringify(updated));
                try {
                  localStorage.setItem(
                    LOCAL_STORAGE_NOTES_PREFIX + itemId,
                    JSON.stringify(updated)
                  );
                } catch (e) {}
                cp.saveAsync(function () {
                  // Also stamp the yellow "📝 Sticky Note" category onto the email in the Inbox list
                  try {
                    if (
                      Office.context.mailbox.masterCategories &&
                      Office.context.mailbox.masterCategories.addAsync
                    ) {
                      Office.context.mailbox.masterCategories.addAsync(
                        [
                          {
                            displayName: "📝 Sticky Note",
                            color: Office.MailboxEnums.CategoryColor.Preset3,
                          },
                        ],
                        function () {}
                      );
                    }
                    if (item.categories && item.categories.addAsync) {
                      item.categories.addAsync(["📝 Sticky Note"], function () {});
                    }
                  } catch (e) {}

                  if (item.notificationMessages) {
                    item.notificationMessages.replaceAsync(
                      "EmailStickyNotesStatus",
                      {
                        type: Office.MailboxEnums.ItemNotificationMessageType
                          .InformationalMessage,
                        message:
                          "Quick Sticky Note stamped (" +
                          updated.length +
                          " total on this email).",
                        icon: "Icon.16x16",
                        persistent: false,
                      },
                      function () {
                        if (event && event.completed) event.completed();
                      }
                    );
                  } else if (event && event.completed) {
                    event.completed();
                  }
                });
              } else if (event && event.completed) {
                event.completed();
              }
            });
          } catch (e) {
            if (event && event.completed) event.completed();
          }
        }

        if (window.Office && Office.onReady) {
          Office.onReady(function () {
            if (Office.actions) {
              Office.actions.associate(
                "addQuickStickyNote",
                addQuickStickyNote
              );
            }
          });
        }
        window.addQuickStickyNote = addQuickStickyNote;
      })();
    </script>
  </body>
</html>
